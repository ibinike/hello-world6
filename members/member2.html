<!DOCTYPE html>

<head>

      background: #f5f5f5;

    .team { font-size: 1.25rem; color: #555; margin: 0 0 1.5rem; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>

<body>
  <main class="card">
    <h1>안녕하세요, 박지연입니다</h1>
    <p class="team">입출고관제팀</p>
    <a href="../index.html">← 처음으로</a>
